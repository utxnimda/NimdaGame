name: Project Checks

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development tools
        run: python -m pip install -e "tools[dev]"

      - name: Check Python style
        run: |
          python -m ruff check tools
          python -m ruff format --check tools

      - name: Test database services
        run: python -m pytest tools/tests -q

      - name: Generate validated runtime data
        run: python tools/mygame_tools/generate_godot_data.py

      - name: Build portable gameplay core
        run: |
          cmake -S core -B build/core
          cmake --build build/core --config Release

      - name: Check release layout
        run: python tools/mygame_tools/release_pipeline.py check
